name: Search distribution

# Every 72 hours. Search engines treat repeated submission of unchanged URLs as
# noise, so this cadence is deliberate — more frequent pings do not index you
# faster, they get the domain throttled.
on:
  schedule:
    - cron: "0 4 */3 * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why you are running this manually"
        required: false
        default: "manual run"

concurrency:
  group: distribution
  cancel-in-progress: false

jobs:
  submit:
    name: Submit URLs to IndexNow and ping sitemap consumers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configuration
        id: check
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::notice::SITE_URL or CRON_SECRET is not set; skipping. See DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger distribution run
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "Submitting ${{ secrets.SITE_URL }} …"
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            "${{ secrets.SITE_URL }}/api/indexnow")

          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -n1)

          echo "$BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Distribution endpoint returned HTTP $CODE"
            exit 1
          fi

          SUBMITTED=$(echo "$BODY" | grep -o '"submitted":[0-9]*' | cut -d: -f2)
          echo "### Search distribution" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URLs submitted: **${SUBMITTED:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run at: $(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the sitemap is reachable
        if: steps.check.outputs.ready == 'true'
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${{ secrets.SITE_URL }}/sitemap.xml")
          if [ "$CODE" != "200" ]; then
            echo "::error::sitemap.xml returned HTTP $CODE"
            exit 1
          fi
          echo "sitemap.xml OK"
