name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The AI assistant's knowledge base is generated from the same typed data
      # that renders the site, so it cannot drift out of sync with the pages.
      - name: Build knowledge base
        run: npm run kb:build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the retrieval evaluation harness: half of that suite is
      # questions the assistant MUST refuse to answer.
      - name: Unit tests and retrieval evals
        run: npm test

      - name: Build
        run: npm run build

      - name: Cache production build
        uses: actions/cache/save@v4
        with:
          path: |
            .next
            knowledge-base
          key: build-${{ github.sha }}

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on high and critical advisories. A monthly manual
      # check means being, on average, two weeks behind a published exploit.
      - name: npm audit
        run: npm run audit:ci

      - name: Assert no secrets reached the client bundle
        run: |
          npm run kb:build
          npm run build
          if grep -rIlE "sk_live_|sk-ant-|AKIA[0-9A-Z]{16}|ANTHROPIC_API_KEY=|LEAD_WEBHOOK_URL=" .next/static/ 2>/dev/null; then
            echo "::error::A secret-shaped string was found in the client bundle."
            exit 1
          fi
          echo "No secret-shaped strings in .next/static."

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge base
        run: npm run kb:build

      - name: Build
        run: npm run build

      # Budget: LCP < 2.5s, CLS < 0.1, TBT < 200ms, all categories >= 90.
      # Three runs, because a single run on a shared runner is noisy enough to
      # fail a good build — and a flaky gate gets disabled within a month.
      - name: Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [verify, security, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge base
        run: npm run kb:build

      - name: Deploy
        id: deploy
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::notice::VERCEL_TOKEN is not configured; skipping deploy."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          URL=$(npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
