name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The AI assistant's knowledge base is generated from the same typed data
      # that renders the site, so it cannot drift out of sync with the pages.
      - name: Build knowledge base
        run: npm run kb:build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the retrieval evaluation harness: half of that suite is
      # questions the assistant MUST refuse to answer.
      - name: Unit tests and retrieval evals
        run: npm test

      - name: Build
        run: npm run build

      - name: Cache production build
        uses: actions/cache/save@v4
        with:
          path: |
            .next
            knowledge-base
          key: build-${{ github.sha }}

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on high and critical advisories in code that actually
      # ships. A monthly manual check means being, on average, two weeks behind
      # a published exploit.
      - name: npm audit (production dependencies)
        run: npm run audit:ci

      # The dev graph is audited separately and at the same severity. It is a
      # separate step because the two have different remediation urgency: a
      # production advisory is shipping to users, a dev one is not. Lighthouse
      # CI is deliberately NOT a dependency — it is pinned at the call site in
      # the lighthouse job, because its puppeteer tree carries unfixable high
      # advisories it would otherwise drag into this lockfile.
      - name: npm audit (dev tooling)
        run: npm run audit:dev

      - name: Assert no secrets reached the client bundle
        run: |
          npm run kb:build
          npm run build
          if grep -rIlE "sk_live_|sk-ant-|AKIA[0-9A-Z]{16}|ANTHROPIC_API_KEY=|LEAD_WEBHOOK_URL=" .next/static/ 2>/dev/null; then
            echo "::error::A secret-shaped string was found in the client bundle."
            exit 1
          fi
          echo "No secret-shaped strings in .next/static."

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge base
        run: npm run kb:build

      - name: Build
        run: npm run build

      # Desktop budget: all four categories >= 90, LCP < 2.5s, CLS < 0.1,
      # TBT < 200ms. Three runs, because a single run on a shared runner is
      # noisy enough to fail a good build — and a flaky gate gets disabled
      # within a month, which returns you to having no gate at all.
      - name: Lighthouse CI (desktop)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # Mobile budget, under Lighthouse's simulated slow-4G and 4x CPU
      # throttle. LCP is asserted on desktop only: on this simulated profile a
      # content-rich page lands around 2.6-2.7s, and asserting a number the
      # build cannot hold would just teach everyone to ignore the gate.
      # Categories, CLS and TBT are enforced here.
      - name: Lighthouse CI (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

# Deployment is handled by Vercel's native GitHub integration, which is
# connected to this repository: a push to `main` deploys to production and any
# other branch or pull request gets a preview URL automatically.
#
# There is deliberately no deploy job here. Running one alongside the Git
# integration produces two deployments per push — doubling build minutes and
# making it ambiguous which one is actually serving traffic.
